name: Build Flutter APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:
    inputs:
      flutter_version:
        description: 'Flutter version'
        required: true
        default: '3.47.2'

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Gradle Cache
        uses: actions/cache@v5
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ github.event.inputs.flutter_version || '3.47.2' }}
          cache: true
          channel: stable

      # المشروع مرفوع بدون مجلد android، فنولّده هنا تلقائيًا (لو مش موجود)
      - name: Generate Android platform files (if missing)
        run: |
          if [ ! -f android/app/build.gradle ] && [ ! -f android/app/build.gradle.kts ]; then
            echo "android/ not found: generating it"
            mkdir -p /tmp/keep
            cp -r lib /tmp/keep/lib
            cp pubspec.yaml /tmp/keep/pubspec.yaml
            flutter create . --platforms=android --org com.cobrashield --project-name cobra_shield
            rm -rf lib pubspec.yaml test
            cp -r /tmp/keep/lib lib
            cp /tmp/keep/pubspec.yaml pubspec.yaml
          else
            echo "android/ already exists: skipping"
          fi

      # Manifest (إذن الإنترنت + استقبال المشاركة + منع النسخ الاحتياطي) و MainActivity والأيقونة
      - name: Apply Android overlay
        run: |
          APP=android/app/src/main
          cp android_overlay/AndroidManifest.xml "$APP/AndroidManifest.xml"
          mkdir -p "$APP/kotlin/com/cobrashield/cobra_shield"
          cp android_overlay/MainActivity.kt "$APP/kotlin/com/cobrashield/cobra_shield/MainActivity.kt"
          for d in android_overlay/res/mipmap-*; do
            cp -r "$d" "$APP/res/"
          done
          echo "--- manifest ---"
          head -20 "$APP/AndroidManifest.xml"
          find android/app/src/main -name 'MainActivity.*'

      # توقيع إصدار ثابت (اختياري): يعمل فقط لو أضفت الأسرار دي في إعدادات
      # الريبو (Settings -> Secrets and variables -> Actions):
      # KEYSTORE_BASE64, KEYSTORE_PASSWORD, KEY_PASSWORD, KEY_ALIAS
      # لو الأسرار غير موجودة تتجاهل الخطوة دي والبناء يفضل بتوقيع debug
      # زي ما كان، فمفيش خطر لو متضبطتش.
      - name: Configure release signing (optional)
        if: ${{ secrets.KEYSTORE_BASE64 != '' }}
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > android/app/upload-keystore.jks
          {
            echo "storePassword=${{ secrets.KEYSTORE_PASSWORD }}"
            echo "keyPassword=${{ secrets.KEY_PASSWORD }}"
            echo "keyAlias=${{ secrets.KEY_ALIAS }}"
            echo "storeFile=upload-keystore.jks"
          } > android/key.properties
          echo "release signing configured"

      # يرفع minSdk لـ 24 (تحتاجه مكتبات الكاميرا/الصور) ويربط التوقيع أعلاه
      # لو موجود. آمن حتى لو مفيش key.properties (يفضل بتوقيع debug).
      - name: Patch Android Gradle (minSdk + signing)
        run: |
          GRADLE_FILE=android/app/build.gradle.kts
          if [ ! -f "$GRADLE_FILE" ]; then GRADLE_FILE=android/app/build.gradle; fi
          python3 android_overlay/patch_build_gradle.py "$GRADLE_FILE"

      - name: Get dependencies
        run: flutter pub get

      # يكشف أخطاء Dart (أنواع، استيرادات، صياغة) في دقيقة بدل اكتشافها بعد
      # بناء Gradle كامل بياخد وقت أطول بكتير. بيفشل بس على أخطاء حقيقية
      # (--no-fatal-infos/--no-fatal-warnings) مش على ملاحظات أسلوب بسيطة.
      - name: Analyze Dart code
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Build APK
        run: flutter build apk --release --obfuscate --split-debug-info=build/symbols

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 7
